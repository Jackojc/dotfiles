if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

set -s terminal-overrides[100] '*col*:RGB'
set -s terminal-overrides[101] '*:Ms=\E]52;c%p1%.0s;%p2%s\007'

set -s terminal-features[100] 'foot*:extkeys'
set -s terminal-features[101] 'wezterm*:extkeys'

set -g allow-passthrough on

# Prefixes.
set -g prefix M-Space
set -g prefix2 C-b

# Press prefix twice to pass through sequence to the terminal.
bind 'M-Space' send-prefix
bind 'C-b' send-prefix -2

# Misc
set -g renumber-windows on
set -g display-time 4000
set -g history-limit 100000
set -g set-clipboard on
set -g mouse on
set -g focus-events on
set -g aggressive-resize on

set -g base-index 1
set -g pane-base-index 1

set -s extended-keys on

# No delays
set -s escape-time 0
set -g repeat-time 0

set -g monitor-activity off
set -g monitor-silence 0

set -g monitor-bell on
set -g visual-bell off

# Reload tmux config.
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

set -g status-interval 0

# Window status.
set -g allow-rename off
set -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#{pane_current_command}'

# Mouse scroll by 1 line.
bind -T copy-mode WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode WheelDownPane send -N 1 -X scroll-down
bind -T copy-mode-vi WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down

bind -n WheelUpPane {
	if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
		send -M
	} {
		if -F '#{alternate_on}' { send-keys -N 1 Up } { copy-mode -e }
	}
}

bind -n WheelDownPane {
	if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
		send -M
	} {
		if -F '#{alternate_on}' { send-keys -N 1 Down }
	}
}

# Session switcher
bind C-s choose-tree -ZwO activity

# Command palette
bind C-p run-shell tmux-commands

# Open history in editor
bind C-h run-shell tmux-scrollback

# Create new panes or windows.
bind -n M-v split-window -c "#{pane_current_path}"
bind -n M-h split-window -h -c "#{pane_current_path}"
bind -n M-c new-window -ac "#{pane_current_path}"

# Window switching.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

# Resize panes.
bind -n C-M-Down  resize-pane -D 1
bind -n C-M-Up    resize-pane -U 1
bind -n C-M-Left  resize-pane -L 1
bind -n C-M-Right resize-pane -R 1

# Use alt+arrow keys without prefix key to switch panes.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Move panes.
bind -n "M-S-Left"  swap-pane -d -t '{left-of}'
bind -n "M-S-Down"  swap-pane -d -t '{down-of}'
bind -n "M-S-Up"    swap-pane -d -t '{up-of}'
bind -n "M-S-Right" swap-pane -d -t '{right-of}'

# Focus left/right between windows.
bind -n M-, previous-window
bind -n M-. next-window

# Fullscreen toggle.
bind -n M-f resize-pane -Z

# Switch between panes while zoomed.
bind C-Tab select-pane -Z -t .+1

# Close pane with confirmation.
bind -n M-x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Switch to last window.
bind -n M-Escape last-window

set -g status-style "bg=default,fg=default"
set -g status-justify left
set -g status-left ""

set -g pane-border-indicators both
set -g pane-active-border-style 'fg=#63c0f7'
set -g pane-border-style        'fg=#292a34'

set -g window-status-separator ""
set -g window-status-style         "fg=#8a8578"
set -g window-status-current-style "bg=#63c0f7,fg=#0e0f1a"
set -g window-status-format         " #I:#W#F "
set -g window-status-current-format " #I:#W#F "

set -g window-status-bell-style     "fg=#e3691d,bold,reverse"

set -g status-right "\
#{?client_prefix,#[fg=#e3691d#,bold#,reverse] prefix #[default] ,}\
#{?window_zoomed_flag,#[fg=#63c0f7#,bold]zoom#[default] | ,}\
#S | #H"

set -g mode-style    "bg=#63c0f7,fg=#0e0f1a"
set -g message-style "bg=#fdf153,fg=#0e0f1a,fill=#fdf153"
