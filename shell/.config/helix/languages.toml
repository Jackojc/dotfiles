# LSPs
[language-server.clangd]
command = "clangd"
args = [ "-header-insertion=never", "--clang-tidy" ]

# [language-server.clang-format]
# command = "clang-format"

# [language-server.meson-format]
# command = "meson format"

[language-server.tinymist]  # Typst
command = "tinymist"
# config = { exportPdf = "onType"}
# config = { exportPdf = "onType", preview.background.enabled = true, preview.background.args = [ "--data-plane-host=127.0.0.1:23635", "--invert-colors=never", "--open" ]}

[language-server.pyright]  # Python
command = "pyright-langserver"
args = [ "--stdio" ]

# [language-server.black]  # Python
# command = "black"
# args = ["--quiet", "-"]

# Languages
[[language]]
name = "bash"
language-id = "bash"
auto-format = false
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "meson"
language-id = "meson"
file-types = [ { glob = "meson.build" }, { glob = "meson_options.txt" } ]
roots = [ "meson.build", "meson_options.txt" ]
indent = { tab-width = 2, unit = "  " }
# language-servers = [ "meson-format" ]
formatter = { command = "meson", args = ["format", "-"] }

[[language]]
name = "cpp"
language-id = "cpp"
file-types = [ "cpp", "hpp", "cxx", "hxx" ]
roots = [ "CMakeLists.txt", "Makefile" ]
auto-format = true
indent = { tab-width = 4, unit = "\t" }
language-servers = [ "clangd" ]
formatter = { command = "clang-format", args = [] }

[[language]]
name = "c"
language-id = "c"
file-types = [ "c", "h" ]
roots = [ "Makefile" ]
auto-format = true
indent = { tab-width = 4, unit = "\t" }
language-servers = [ "clangd" ]
formatter = { command = "clang-format", args = [] }

[[language]]
name = "typst"
scope = "source.typst"
file-types = ["typst", "typ"]
indent = { tab-width = 2, unit = "  " }
comment-token = "//"
injection-regex = "typ(st)?"
roots = ["typst.toml"]
auto-format = true
language-servers = ["tinymist"]
formatter = { command = "typstyle", args = [] }
auto-pairs = { '(' = ')', '{' = '}', '[' = ']', '$' = '$', '"' = '"' }

[[language]]
name = "python"
language-id = "python"
file-types = [ "py" ]
roots = ["pyproject.toml", "setup.py", "Poetry.lock", ".git"]
auto-format = true
language-servers = [ "pyright" ]
formatter = { command = "black", args = ["-", "-q"] }

[[language]]
name = "cane"
scope = "source.cane"
file-types = ["cane"]
comment-tokens = [";"]
indent = { tab-width = 2, unit = "  " }
grammar = "cane"

[[grammar]]
name = "cane"
source = { path = "/home/jack/.config/helix/grammars/cane" }
